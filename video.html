<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Surprise Video ❤️</title>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .video-container {
            width: 90%;
            max-width: 420px;
            background: #000;
            border-radius: 20px;
            padding: 8px;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.6);
            border: 2px solid #ff2a5f;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 14px;
            display: block;
        }
        .back-btn {
            margin-top: 20px;
            background: linear-gradient(45deg, #ff2a5f, #ff758f);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video controls autoplay playsinline>
            <source src="birthday_video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Main Page par wapas jaane ke liye button -->
    <a href="index.html" class="back-btn">⬅️ Back to Main Page</a>

</body>
</html>
